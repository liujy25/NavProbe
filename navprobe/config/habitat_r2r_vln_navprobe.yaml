# @package _global_

defaults:
  - /benchmark/nav/vln_r2r.yaml
  - _self_

habitat:
  task:
    measurements:
      success:
        success_distance: 3.0

  dataset:
    type: R2RVLN-v1
    split: val_seen
    data_path: "data/datasets/vln/mp3d/r2r/v1/{split}/{split}.json.gz"
    scenes_dir: "data/scene_datasets/"

  simulator:
    forward_step_size: 0.25
    turn_angle: 30
    agents:
      main_agent:
        height: 1.2
        radius: 0.10
        sim_sensors:
          rgb_sensor:
            width: 960
            height: 540
            hfov: 135
            position: [0.0, 1.2, 0.0]
            orientation: [-0.5235987756, 0, 0]
          depth_sensor:
            width: 960
            height: 540
            hfov: 135
            min_depth: 0.1
            max_depth: 5.0
            normalize_depth: False
            position: [0.0, 1.2, 0.0]
            orientation: [-0.5235987756, 0, 0]
    habitat_sim_v0:
      allow_sliding: False
