# @package _global_

defaults:
  - /habitat: habitat_config_base
  - /habitat/task: objectnav
  - /habitat/simulator/sensor_setups@habitat.simulator.agents.main_agent: rgbd_agent
  - _self_

habitat:
  environment:
    max_episode_steps: 500

  task:
    measurements:
      success:
        success_distance: 1.0

  dataset:
    type: ObjectNav-v1
    split: val
    data_path: data/datasets/objectnav/hm3d/objectnav_hm3d_v2/{split}/{split}.json.gz
    scenes_dir: data/scene_datasets/

  simulator:
    type: Sim-v0
    turn_angle: 30
    agents:
      main_agent:
        height: 0.88
        radius: 0.18
        sim_sensors:
          rgb_sensor:
            width: 960
            height: 540
            hfov: 135
            position: [0.0, 1.2, 0.0]
            orientation: [-0.5235987756, 0, 0]
          depth_sensor:
            width: 960
            height: 540
            hfov: 135
            min_depth: 0.1
            max_depth: 5.0
            normalize_depth: False
            position: [0.0, 1.2, 0.0]
            orientation: [-0.5235987756, 0, 0]
    habitat_sim_v0:
      gpu_device_id: 0
      allow_sliding: False
    scene_dataset: data/scene_datasets/hm3d_v0.2/hm3d_annotated_basis.scene_dataset_config.json
